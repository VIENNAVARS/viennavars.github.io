<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" width="400" height="390" fill="none">
  <!-- Abstracted Iconic Signet of the Authentic Avar Gold Earring (Met 17.191.4-5) -->
  
  <!-- 1. Top Open Circular Hoop (Same width as lower sphere, open gap at lower-left ~7:30) -->
  <!-- Center (200, 96), r=50. Gap from angle 132 deg to 165 deg (in SVG coords where 0 is right, 90 is down) -->
  <path d="M 151.7 108.9 A 50 50 0 1 1 166.5 133.2"
        stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" fill="none"/>

  <!-- 2. Short Cylindrical Neck Collar at Base of Hoop -->
  <rect x="186" y="145" width="28" height="14" rx="3" stroke="#ffffff" stroke-width="7" fill="#080c14"/>

  <!-- 3. Middle Tier: Paired Globular Bosses Sitting Together Under the Neck (Not alarm-clock bells!) -->
  <circle cx="174" cy="182" r="23" stroke="#ffffff" stroke-width="7.5" fill="#080c14"/>
  <circle cx="226" cy="182" r="23" stroke="#ffffff" stroke-width="7.5" fill="#080c14"/>

  <!-- 4. Lower Tier: Large Hollow Globe Pendant (Bommel, r=50, matching top hoop width) -->
  <circle cx="200" cy="242" r="50" stroke="#ffffff" stroke-width="8.5" fill="#080c14"/>

  <!-- Subtle Curved Meridian Arcs on Left & Right of the Lower Globe -->
  <path d="M 172 201 A 56 56 0 0 0 172 283" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M 228 201 A 56 56 0 0 1 228 283" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" fill="none"/>

  <!-- Central Medallion with Diagonal X-Cross Openwork Rosette -->
  <circle cx="200" cy="242" r="17" stroke="#ffffff" stroke-width="6" fill="#080c14"/>
  <line x1="190" y1="232" x2="210" y2="252" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="210" y1="232" x2="190" y2="252" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>

  <!-- 5. Small Flat Terminal Cap at Bottom Pole -->
  <rect x="187" y="292" width="26" height="8" rx="3" stroke="#ffffff" stroke-width="6.5" fill="#080c14"/>

  <!-- Wordmark: Montserrat / Space Grotesk Bold — VIENNA (#ffffff) + VARS (#e5a93c) -->
  <text x="200" y="362" text-anchor="middle" font-family="'Montserrat', 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-weight="800" letter-spacing="2">
    <tspan fill="#ffffff">VIENNA</tspan><tspan fill="#e5a93c">VARS</tspan>
  </text>
</svg>
